name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build JRE JAR files
      run: |
        chmod +x gradlew
        mkdir -p out
        ./gradlew jre_lwjgl3glfw:build --no-daemon

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew ZalithLauncher:assembleDebug -Darch=all

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: EclipseLaunch-debug
        path: ZalithLauncher/build/outputs/apk/debug/*
        retention-days: 14
