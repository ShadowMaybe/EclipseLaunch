# required for building jre_lwjgl3glfw with Java 8 while using plugins in EclipseLaunch that require Java 11
# Increase Gradle daemon RAM allocation
org.gradle.jvmargs=-Xmx4096M
org.gradle.configureondemand=true

android.useAndroidX=true
android.enableJetifier=true
android.bundle.language.enableSplit=false
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableAppCompileTimeRClass=false

# AGP 9.x compatibility: opt out of new DSL and built-in Kotlin
android.newDsl=false
android.builtInKotlin=false
